name: Site Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run site validator
        run: python scripts/validate_site.py
