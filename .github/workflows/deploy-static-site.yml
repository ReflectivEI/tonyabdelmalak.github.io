name: Deploy Static Site (Cloudflare Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          missing=0
          if [ -z "$CF_TOKEN" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "Missing required secret: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ -z "$CF_PAGES_PROJECT" ]; then
            echo "Missing required secret: CLOUDFLARE_PAGES_PROJECT"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Wrangler (v4)
        run: |
          npm i -g wrangler@4
          wrangler --version

      - name: Deploy static site to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          wrangler pages deploy . \
            --project-name "$CF_PAGES_PROJECT" \
            --branch main
