name: Deploy Cloudflare Worker (chat API only)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Explain deploy scope
        run: |
          echo "This workflow deploys only wrangler.toml worker entry (chat-widget/worker.js)."
          echo "It does NOT publish index.html/static site assets to tonyabdelmalak.com."

      - name: Validate required secret
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Install Wrangler (v4)
        run: |
          npm i -g wrangler@4
          wrangler --version

      - name: Deploy via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --config wrangler.toml
